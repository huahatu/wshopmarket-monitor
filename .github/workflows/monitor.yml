name: Weverse Monitor

on:
  schedule:
    # 每 15 分鐘執行一次（GitHub 的排程時間不保證分秒不差，可能會有幾分鐘誤差，屬正常現象）
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "勾選後只發送測試通知，不檢查商品頁面（用來驗證 Discord/Telegram/Gmail 有沒有設定成功）"
        type: boolean
        default: false
      status_check:
        description: "勾選後立即查詢並發送目前完整庫存狀態（不用等排程自動偵測到變化）"
        type: boolean
        default: false

permissions:
  contents: write   # 需要這個權限才能把 state.json 的最新狀態寫回倉庫

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行一次檢查（或測試通知）
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_MUJI: ${{ secrets.DISCORD_WEBHOOK_URL_MUJI }}
          DISCORD_WEBHOOK_URL_5MUSIC: ${{ secrets.DISCORD_WEBHOOK_URL_5MUSIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          if [ "${{ inputs.test_notification }}" = "true" ]; then
            python weverse_monitor.py --test
          elif [ "${{ inputs.status_check }}" = "true" ]; then
            python weverse_monitor.py --status
          else
            python weverse_monitor.py --once
          fi

      - name: 把最新狀態寫回倉庫（避免重複通知）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "更新監控狀態 [skip ci]"
          git push
        continue-on-error: true
