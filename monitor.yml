name: Weverse Monitor

on:
  schedule:
    # 每 15 分鐘執行一次（GitHub 的排程時間不保證分秒不差，可能會有幾分鐘誤差，屬正常現象）
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # 讓你可以在 GitHub 網頁上手動點一次「Run workflow」來測試

permissions:
  contents: write   # 需要這個權限才能把 state.json 的最新狀態寫回倉庫

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行一次檢查
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python weverse_monitor.py --once

      - name: 把最新狀態寫回倉庫（避免重複通知）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "更新監控狀態 [skip ci]"
          git push
        continue-on-error: true
